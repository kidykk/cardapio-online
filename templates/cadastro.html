
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | SASHIMI NOKU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-cadastro">

    <div class="cartao-cadastro">
        <h1>SASHIMI NOKU</h1>
        <p class="texto-cadastro">Crie sua conta e aproveite nosso cardápio.</p>

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                {% for mensagem in mensagens %}
                    <p class="mensagem-cadastro">{{ mensagem }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>

            <button type="submit">CRIAR CONTA</button>
        </form>

        <a href="{{ url_for('inicio') }}">Voltar ao cardápio</a>
    </div>

</body>
</html>
